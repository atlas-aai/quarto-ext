title: DLM Report
author: ATLAS Research and Psychometrics
version: 0.1.0
quarto-required: ">=1.9.17"
contributes:
  formats:
    common:
      filters:
        - path: dlm-report.lua
          at: pre-quarto
        - path: dlm-fig-note.lua
          at: post-quarto
        - path: dlm-book-typst.lua
          at: post-quarto
      number-sections: true
      number-depth: 4
      tbl-cap-location: top
      fig-cap-location: bottom
      fig-width: 6
      fig-asp: 0.618
      fig-dpi: 300
      knitr:
        opts_chunk:
          collapse: true
      execute:
        echo: false
        warning: false
        message: false
      lang: en-US
      csl: apa.csl

    html:
      theme:
        light: [html/dlm-light.scss, html/dlm.scss]
        dark: [html/dlm-dark.scss, html/dlm.scss]
      template-partials:
        - html/title-block.html
      toc: true
      toc-depth: 3
      toc-title: On this page
      code-copy: true
      code-overflow: scroll
      anchor-sections: true
      smooth-scroll: true
      link-external-newwindow: true
      reference-location: margin
      citation-location: document
      grid:
        sidebar-width: 290px
        body-width: 820px
        margin-width: 270px

    typst:
      template-partials:
        - typst/typst-template.typ
        - typst/typst-show.typ
        - typst/page.typ
        - typst/numbering.typ
        - typst/biblio.typ
      font-paths:
        - fonts/ttf
        - fonts/otf
      fontsize: 11pt
      papersize: us-letter
      pdf-standard: [a-2a, ua-1]
      citeproc: true
      link-citations: true
      toc-title: Contents
      toc: true
      toc-depth: 2
      lof: true
      lot: true
      fig-format: png
      keep-typ: false
